name: Build jogo.exe

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        shell: bash
        run: gcc -Wall -Wextra -std=c11 -IStructs -IFases -Imain main/*.c Structs/*.c Fases/*.c -o jogo.exe
      - uses: actions/upload-artifact@v4
        with:
          name: jogo-windows
          path: jogo.exe
